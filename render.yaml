# Render Blueprint for the MediTrack API.
# Deploy with: Render Dashboard → New → Blueprint → pick this repo.
# Secrets (MONGODB_URI, CLIENT_ORIGIN) are left blank on purpose — set them in
# the Render dashboard after the first deploy.
services:
  - type: web
    name: meditrack-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_DB_NAME
        value: meditrack
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: STORAGE_DRIVER
        value: local
