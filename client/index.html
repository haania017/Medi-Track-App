<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MediTrack helps you organise medicines, schedules, stock, expiry dates and family reminders in one calm, private place."
    />
    <meta name="color-scheme" content="light dark" />
    <title>MediTrack — Simple medicine management for families</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong mode.
      (function () {
        try {
          var raw = localStorage.getItem('meditrack.theme');
          var theme = raw ? JSON.parse(raw) : null;
          var mode = (theme && theme.mode) || 'system';
          var light = (theme && theme.lightPalette) || 'monochrome';
          var dark = (theme && theme.darkPalette) || 'midnight';
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
          var root = document.documentElement;
          root.setAttribute('data-mode', resolved);
          root.setAttribute('data-palette', resolved === 'dark' ? dark : light);
          root.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.setAttribute('data-mode', 'light');
          document.documentElement.setAttribute('data-palette', 'monochrome');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
